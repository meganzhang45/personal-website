    <div class="header-c">
        <h1>Contact</h1>
        <p>If you have any suggestions for improvement, are looking to connect,

            to leave a message below, or shoot an <a  class="my-email" href=mailto:megzhangg@gmail.com><b>email</b></a>! :&#41
