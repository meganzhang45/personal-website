    <div class="header-c">
        <h1>Contact</h1>
        <p>If you have any suggestions for improvement, are looking to connect, 
            or just want to talk, I'm always open to meeting new people! Feel free
            to leave a message below. :&#41
        </p>

    <main class="hero-c">
        <div class="contact-box">
            <div class="container-c">
                <form action="">
                    <label for="name"><b>Name</b></label>
                    <input type="text" id="name" name="name" placeholder="Your Name">

                    <label for="Message"><b>Message</b></label>
                    <textarea name="message" id="message" cols="30" rows="10"></textarea>
                </form>
            </div>

        </div>
    </main>
